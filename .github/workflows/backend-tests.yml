name: Backend regression tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Run backend and matching regressions without live providers
        working-directory: backend
        env:
          PYTHONPATH: .
          GEMINI_API_KEY: ''
          BYPASS_AUTH: 'false'
        run: python -m pytest tests regression_tests -q
